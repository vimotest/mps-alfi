/*
  Several Gradle tasks which make calls to ANT.

  Note: calling ant directly will not work for some reasons with MPS.
        So as a workaround, use the bundled JVM (JBR) and ANT libs which are downloaded with MPS (see download-mps.gradle)
 */

import org.apache.tools.ant.taskdefs.condition.Os

ext.mpsHome = getMpsHome()
ext.javaHome = getJavaHome()
ext.antHome = "$mpsHome/lib/ant"

def antLauncherJarPath = "$antHome/lib/ant-launcher.jar"
def mpsUtilJarPath = getConcatenatedMpsUtilJarPaths()

def getAntBuildFileArgs() {
    if (project.hasProperty('antBuildFile')) {
        return ["-buildfile", project.property('antBuildFile')]
    }
    return []
}

task mpsAntGenerate(type: Exec) {
    group 'mps-ant-wrapper'
    commandLine(["$javaHome/bin/java", "-classpath", antLauncherJarPath, "-Dmps_home=$mpsHome", "-Dproject_home=$projectDir", "org.apache.tools.ant.launch.Launcher", "-cp", mpsUtilJarPath] + getAntBuildFileArgs() + ["generate"])
}

task mpsAntBuild(type: Exec) {
    group 'mps-ant-wrapper'
    commandLine(["$javaHome/bin/java", "-classpath", antLauncherJarPath, "-Dmps_home=$mpsHome", "-Dproject_home=$projectDir", "org.apache.tools.ant.launch.Launcher", "-cp", mpsUtilJarPath] + getAntBuildFileArgs() + ["build"])
    mustRunAfter mpsAntGenerate
}

task mpsAntCheck(type: Exec) {
    group 'mps-ant-wrapper'
    doFirst {
        file("$buildDir/system").deleteDir()
        file("$buildDir/config").deleteDir()
    }
    commandLine(["$javaHome/bin/java", "-classpath", antLauncherJarPath, "-Dmps_home=$mpsHome", "-Dproject_home=$projectDir", "org.apache.tools.ant.launch.Launcher", "-cp", mpsUtilJarPath] + getAntBuildFileArgs() + ["check"])
}

task mpsAntCommand(type: Exec) {
    group 'mps-ant-wrapper'
    description 'Run <antCmd> using ant. Example: gradlew mpsAntCommand -PantCmd=clean'
    commandLine(["$javaHome/bin/java", "-classpath", antLauncherJarPath, "-Dmps_home=$mpsHome", "-Dproject_home=$projectDir", "org.apache.tools.ant.launch.Launcher", "-cp", mpsUtilJarPath] + getAntBuildFileArgs() + [findProperty('antCmd') ?: '-p'])
}

task mpsAntMigrate {
    group 'mps-ant-wrapper'
    description 'Headlessly runs MPS project migrations on the current repository'

    doLast {
        def mpsDir = file("$projectDir/.mps")
        if (!mpsDir.exists()) {
            println "No .mps directory found in $projectDir; skipping MPS model migration."
            return
        }

        def migrationBuildFile = file("$buildDir/mps-migration.xml")
        migrationBuildFile.parentFile.mkdirs()
        def depsPath = file("$projectDir/build/mps-bundle/dependencies").absolutePath
        def projectPath = projectDir.absolutePath
        def mpsHomePath = file(mpsHome).absolutePath

        migrationBuildFile.text = """<project name="mps-headless-migration" default="migrate">
  <path id="mps.ant.path">
    <fileset dir="${mpsHomePath}/lib/ant/lib">
      <include name="*.jar"/>
    </fileset>
    <fileset dir="${mpsHomePath}/lib">
      <include name="util-8.jar"/>
      <include name="util_rt.jar"/>
      <include name="util.jar"/>
      <include name="3rd-party-rt.jar"/>
    </fileset>
  </path>
  
  <taskdef name="mps-migrate" classname="jetbrains.mps.build.ant.MigrationTask" classpathref="mps.ant.path"/>
  
  <target name="migrate">
    <echo message="Running headless MPS migration for ${projectPath}..."/>
    <mps-migrate mpshome="${mpsHomePath}" project="${projectPath}" autoplugindiscovery="true" haltonprecheckfailure="false" haltondependencyerror="false">
      <jvmargs>
        <arg value="-Xmx2048m"/>
        <arg value="-Didea.plugins.path=${depsPath}"/>
      </jvmargs>
    </mps-migrate>
  </target>
</project>"""

        project.exec {
            commandLine "$javaHome/bin/java",
                "-classpath", antLauncherJarPath,
                "-Dmps_home=$mpsHome",
                "-Dproject_home=$projectDir",
                "org.apache.tools.ant.launch.Launcher",
                "-cp", mpsUtilJarPath,
                "-buildfile", migrationBuildFile.absolutePath,
                "migrate"
        }
    }
}

task mpsMigrate {
    group 'mps'
    description 'Headlessly migrates models in the project to the current MPS version'
    dependsOn 'mpsAntMigrate'
}

task parseTestReportAfterAntCheck {
    group 'mps-ant-wrapper'
    dependsOn mpsAntCheck

    def mpsTestsReportDir = file("$projectDir/build/mps-tests")
    doFirst {
        mpsTestsReportDir.deleteDir()
    }
    doLast {
        def anyTaskFailed = false
        def mpsMajorVersion = mpsVersion.takeBefore(".")
        def testFilePattern = mpsMajorVersion.toInteger() >= 2023 ? "TEST-junit-*.xml" : "TEST-jetbrains.mps.testbench.junit.*.xml"
        fileTree(dir: projectDir, includes: [testFilePattern]).each {
            def testsuite = new XmlSlurper().parse(it)
            testsuite.testcase.each { testcase ->
                def message = ""
                def result = "PASS"
                if (!testcase.failure.isEmpty()) {
                    result = "FAIL"
                    message = ": ${testcase.failure.@message}"
                    anyTaskFailed = true
                } else if (!testcase.error.isEmpty()) {
                    result = "ERROR"
                    message = ": ${testcase.error.@message}"
                    anyTaskFailed = true
                } else if (!testcase.skipped.isEmpty()) {
                    result = "SKIP"
                }

                println("${result} ${testcase.@classname}#${testcase.@name}${message}")
            }
            mpsTestsReportDir.mkdirs()
            it.renameTo(file("$mpsTestsReportDir/$it.name"))
        }

        if (anyTaskFailed) {
            throw new GradleException("At least one MPS test failed")
        }
    }
}

task mpsAntClean(type: Exec) {
    group 'mps-ant-wrapper'
    commandLine "$javaHome/bin/java", "-classpath", antLauncherJarPath, "-Dmps_home=$mpsHome", "org.apache.tools.ant.launch.Launcher", "-cp", mpsUtilJarPath, "clean"
}

task mpsAntCleanSources(type: Exec) {
    group 'mps-ant-wrapper'
    commandLine "$javaHome/bin/java", "-classpath", antLauncherJarPath, "-Dmps_home=$mpsHome", "org.apache.tools.ant.launch.Launcher", "-cp", mpsUtilJarPath, "cleanSources"

    doLast {
        def dirsToDelete = collectGeneratedDirs(file("languages")) + collectGeneratedDirs(file("solutions"))
        dirsToDelete.each { it.deleteDir() }
    }
}

private List<File> collectGeneratedDirs(File baseDir) {
    def dirs = []
    if (!file(baseDir).exists()) {
        return dirs
    }
    file(baseDir).eachDirRecurse {
        if (it.name.endsWith("_gen.caches") || it.name == "classes_gen" || it.name == "source_gen") {
            dirs += it
        }
    }
    return dirs
}

private static String getJavaHome() {
    def mpsHome = getMpsHome()
    if (System.env.getOrDefault('PREINSTALLED_JAVA_PATH', "") != "") {
        return System.env['PREINSTALLED_JAVA_PATH']
    }
    if (Os.isFamily(Os.FAMILY_MAC)) {
        return "$mpsHome/jbr/Contents/Home"
    }
    return "$mpsHome/jbr"
}

private static String getMpsHome() {
    if (Os.isFamily(Os.FAMILY_MAC)) {
        return 'build/mps-bundle/Contents'
    }
    return 'build/mps-bundle/mps'
}

private static String concatJavaClasspath(String... paths) {
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        return paths.join(";")
    } else {
        return paths.join(":")
    }
}

task mpsOpenProjectInMpsForCurrentOs(type: Exec) {
    group 'mps-ant-wrapper'
    dependsOn buildOsSpecificBundle

    workingDir projectDir

    environment "JAVA_HOME", "$projectDir/build/mps-bundle/mps/jbr/bin"

    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        environment "MPS_VM_OPTIONS", "$projectDir/build/mps-bundle/mps/bin/mps64.exe.vmoptions"
        commandLine 'build/mps-bundle/mps/bin/mps.bat', projectDir
    } else if (Os.isFamily(Os.FAMILY_MAC)) {
        environment "MPS_VM_OPTIONS", "$projectDir/build/mps-bundle/Contents/bin/mps64.vmoptions"
        commandLine 'build/mps-bundle/Contents/MacOS/mps', projectDir
    } else if (Os.isFamily(Os.FAMILY_UNIX)) {
        environment "MPS_VM_OPTIONS", "$projectDir/build/mps-bundle/mps/bin/mps64.vmoptions"
        commandLine 'sh', 'build/mps-bundle/mps/bin/mps.sh', projectDir
    }
}

private String getConcatenatedMpsUtilJarPaths() {
    def mpsMajorVersion = mpsVersion.takeBefore(".")
    if (mpsMajorVersion.toInteger() >= 2023) {
        return concatJavaClasspath("$mpsHome/lib/util-8.jar")
    }
    return concatJavaClasspath("$mpsHome/lib/util.jar", "$mpsHome/lib/3rd-party-rt.jar")
}
